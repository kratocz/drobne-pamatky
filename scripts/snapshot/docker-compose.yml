# Lokální MariaDB 10.11 (ARM64 native, kompatibilní se zdrojovým MySQL 5.5 dumpem
# z drobnepamatky.cz) pro vývoj export skriptů. Žádné citlivé persistence – jen
# scratchpad pro pilot queries a generování JSON snapshotů.
#
# Spuštění (vyžaduje proměnnou OLD_DB_PASSWORD z .env):
#   set -a; source ../../.env; set +a
#   docker compose -f scripts/snapshot/docker-compose.yml up -d
# Import dumpu (jednou):
#   gzip -dc ~/IdeaProjects/github.com/kratocz/drobnepamatky.cz/backups/gk66-*.sql.gz \
#     | docker exec -i dp-gk66 mariadb -u root -p"$OLD_DB_PASSWORD" gk66
# Vypnout:
#   docker compose -f scripts/snapshot/docker-compose.yml down
# Smazat data:
#   docker compose -f scripts/snapshot/docker-compose.yml down -v

services:
  db:
    image: mariadb:10.11
    container_name: dp-gk66
    ports:
      - "13306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${OLD_DB_PASSWORD:?OLD_DB_PASSWORD must be set in .env}
      MARIADB_DATABASE: gk66
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - dp-gk66-data:/var/lib/mysql
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --max-allowed-packet=128M

volumes:
  dp-gk66-data:
