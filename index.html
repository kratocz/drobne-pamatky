<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drobné památky – mapa</title>
    <meta name="description" content="Statická archivační mapa drobných památek v ČR. Data z drobnepamatky.cz.">

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    <link rel="stylesheet" href="assets/style.css">
    <!-- CF_BEACON -->
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <h1>Drobné památky</h1>
            <p class="subtitle">
                Archivační mapa drobných památek v ČR. Data z
                <a href="https://www.drobnepamatky.cz/" target="_blank" rel="noopener">drobnepamatky.cz</a>.
            </p>
        </div>
        <div class="header-search">
            <input type="search" id="search-input"
                   placeholder="Hledat (např. „kaple Strakonice")"
                   autocomplete="off" aria-label="Hledat památky">
            <div id="search-results" class="search-results" hidden></div>
        </div>
    </header>

    <main>
        <div id="map" role="application" aria-label="Mapa drobných památek"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <aside id="detail-panel" class="detail-panel" aria-hidden="true" aria-label="Detail památky">
            <button class="detail-close" type="button" aria-label="Zavřít detail">&times;</button>
            <div class="detail-content"></div>
        </aside>
        <div id="status" class="status-bar" aria-live="polite"></div>
    </main>

    <footer class="app-footer">
        <span>Archivační větev:
            <a href="https://krato.cz" target="_blank" rel="noopener">Petr Kratochvíl</a>
            · <a href="mailto:krato@krato.cz">krato@krato.cz</a>
            · <a href="https://github.com/kratocz/drobne-pamatky" target="_blank" rel="noopener">zdrojový kód</a>
        </span>
        <span>Data: <a href="https://www.drobnepamatky.cz/" target="_blank" rel="noopener">drobnepamatky.cz</a></span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.glify@3.3.1/dist/glify-browser.js"
            integrity="sha384-WU7o01HFshVQYY8E/NrIBqLa5ypyxjjgAzTuP/l9BUqVSxj2VFLdvQvhItV2aWzY"
            crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/minisearch@7.2.0/dist/umd/index.min.js"
            integrity="sha384-9Eacb80ywplqCp0P/bR61+zYn5Pg2LmQ7T8rppdoKHcQMmXbRh1wHwRC8avUJvnz"
            crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"
            integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu"
            crossorigin="anonymous"></script>
    <script src="src/app.js"></script>
</body>
</html>
