<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drobné památky – mapa</title>
    <meta name="description" content="Statická archivační mapa drobných památek v ČR. Data z drobnepamatky.cz.">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <h1>Drobné památky</h1>
            <p class="subtitle">
                Archivační mapa drobných památek v ČR. Data z
                <a href="https://www.drobnepamatky.cz/" target="_blank" rel="noopener">drobnepamatky.cz</a>.
            </p>
        </div>
        <div class="header-search">
            <input type="search" id="search-input"
                   placeholder="Hledat (např. „kaple Strakonice")"
                   autocomplete="off" aria-label="Hledat památky">
            <div id="search-results" class="search-results" hidden></div>
        </div>
    </header>

    <main>
        <div id="map" role="application" aria-label="Mapa drobných památek"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="status" class="status-bar" aria-live="polite"></div>
    </main>

    <footer class="app-footer">
        <span>Archivační větev:
            <a href="https://krato.cz" target="_blank" rel="noopener">Petr Krato</a>
            · <a href="mailto:krato@krato.cz">krato@krato.cz</a>
            · <a href="https://github.com/kratocz/drobne-pamatky" target="_blank" rel="noopener">zdrojový kód</a>
        </span>
        <span>Data: <a href="https://www.drobnepamatky.cz/" target="_blank" rel="noopener">drobnepamatky.cz</a></span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/minisearch@7.2.0/dist/umd/index.min.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
